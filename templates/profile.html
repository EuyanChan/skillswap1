{% extends "base.html" %}

{% block content %}
<div class="card profile-card">
    <h2>编辑我的技能</h2>
    <p class="subtitle">设置你擅长的和你想要的，系统将为你双向匹配</p>
    
    <form method="POST" action="{{ url_for('profile') }}" class="profile-form">
        <div class="form-group">
            <label>我能教 (Teach)</label>
            <input type="text" name="teach" value="{{ me.teach }}" placeholder="例如：Python、吉他" required>
        </div>
        <div class="form-group">
            <label>我想学 (Learn)</label>
            <input type="text" name="learn" value="{{ me.learn }}" placeholder="例如：摄影、英语" required>
        </div>
        <button type="submit" class="btn btn-primary">保存并刷新匹配</button>
    </form>
</div>
{% endblock %}
